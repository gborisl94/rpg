<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>RPG v106 FIX BLEU</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0b1a3a;overflow:hidden;touch-action:none}#c{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const ld=s=>{const i=new Image();i.src=s;return i;};
const player=ld('player.png'),enemies=ld('enemies.png');
const ok=i=>i.complete&&i.naturalWidth>0;
const R=Math.random,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const WORLD_W=1600,WORLD_H=1200;let W=640,H=360,cam={x:800,y:600};
let P,E,A,D,F,T,LB,arrows,fish,expl,score,spawnT,regenT,over,overT,firing,tid,touch,flash,last=0;
let keys={},aim={x:0,y:0},_aimAng=0;
let joy={active:false,id:null,dx:0,dy:0};const JOY={r:55,knob:24};const joyPos=()=>({x:JOY.r+20,y:H-JOY.r-20});
let joyR={active:false,id:null,dx:0,dy:0};const JOYR={r:45,knob:20};const joyRPos=()=>({x:W-JOYR.r-20,y:H-JOYR.r-20});
let fireId=null;const FIRE={r:36};const fireBtnPos=()=>({x:W-JOYR.r-20,y:H-JOYR.r-20-60});
let boltId=null;const BOLT={r:32};const boltBtnPos=()=>({x:W-JOYR.r-20-60,y:H-JOYR.r-20-60});
let zoom=1,zoomTarget=1;const bg=document.createElement('canvas');
function fit(){
 const k=640/Math.max(innerWidth,innerHeight,1);
 W=canvas.width=Math.round(innerWidth*k)||640;H=canvas.height=Math.round(innerHeight*k)||360;
 bg.width=WORLD_W;bg.height=WORLD_H;const b=bg.getContext('2d');
 const g=b.createLinearGradient(0,0,0,WORLD_H);g.addColorStop(0,'#1a0a3a');g.addColorStop(1,'#0a1a3a');
 b.fillStyle=g;b.fillRect(0,0,WORLD_W,WORLD_H);
 for(let x=0;x<=WORLD_W;x+=48){b.strokeStyle='rgba(255,60,172,.12)';b.beginPath();b.moveTo(x,0);b.lineTo(x,WORLD_H);b.stroke();}
 for(let y=0;y<=WORLD_H;y+=48){b.strokeStyle='rgba(29,233,182,.10)';b.beginPath();b.moveTo(0,y);b.lineTo(WORLD_W,y);b.stroke();}
}
function reset(){
 P={x:WORLD_W/2,y:WORLD_H/2,hp:100,max:100,cd:0,shoot:0,anim:0,hit:0};
 cam={x:P.x,y:P.y};E=[];A=[];D=[];F=[];T=[];LB=[];arrows=99;fish=0;expl=6;score=0;spawnT=1.2;regenT=0;
 over=false;overT=0;firing=false;tid=null;touch=null;flash=0;fireId=null;boltId=null;_aimAng=0;
}
function shoot(ex){if(P.cd>0||over)return;if(ex){if(expl<1)return;expl--;}else{if(arrows<1)return;arrows--;}A.push({x:P.x,y:P.y-4,angle:_aimAng,speed:ex?400:580,explosive:ex,life:1.5});P.cd=ex?0.5:0.18;P.shoot=0.12;}
function text(x,y,s,c){T.push({x,y,s,c,t:1});}
function hurt(e,d){e.hp-=d;e.flash=0.1;if(e.hp>0)return;e.dead=true;score+=10;const r=R();if(r<0.35)D.push({x:e.x,y:e.y,k:'fish',t:12});else if(r<0.6)D.push({x:e.x,y:e.y,k:'arrow',t:12});}
function spawn(){if(E.length>25)return;const s=(R()*4)|0,type=(R()*4)|0;const x=s<2?R()*WORLD_W:(s==2?-24:WORLD_W+24);const y=s<2?(s?WORLD_H+24:-24):R()*WORLD_H;E.push({x,y,type,hp:30,sp:42+type*4+R()*10+Math.min(score/60,30),anim:R()*6,flash:0,hit:0});}
function makeBolt(x1,y1,x2,y2){const pts=[{x:x1,y:y1}];for(let i=1;i<8;i++){const t=i/8;pts.push({x:x1+(x2-x1)*t+(R()-0.5)*16,y:y1+(y2-y1)*t+(R()-0.5)*16});}pts.push({x:x2,y:y2});return pts;}
function doLightning(x,y){if(expl<1)return;expl--;flash=0.3;let hits=E.filter(e=>!e.dead&&dist({x,y},e)<110).slice(0,5);let bolts=[];let prev={x:x,y:y-130};for(const e of hits){hurt(e,28);bolts.push(makeBolt(prev.x,prev.y,e.x,e.y));prev=e;}if(hits.length===0)bolts.push(makeBolt(x,y-130,x,y));LB.push({t:0,bolts});text(x,y-18,'FOUDRE!','#7df9ff');}
function update(dt){
 if(over){overT+=dt;return;}
 if(joyR.active){const jr=Math.hypot(joyR.dx,joyR.dy);if(jr>0.15)_aimAng=Math.atan2(joyR.dy,joyR.dx);}
 aim.x=P.x+Math.cos(_aimAng)*65;aim.y=P.y+Math.sin(_aimAng)*65;zoom+=(zoomTarget-zoom)*Math.min(1,dt*8);
 let mx=0,my=0,sp=140;if(keys.ArrowLeft||keys.q||keys.a)mx--;if(keys.ArrowRight||keys.d)mx++;if(keys.ArrowUp||keys.z||keys.w)my--;if(keys.ArrowDown||keys.s)my++;
 if(joy.active){const jl=Math.hypot(joy.dx,joy.dy);if(jl>0.15){mx=joy.dx/jl;my=joy.dy/jl;sp=110+Math.min(jl,1)*70;}else{mx=0;my=0;}}else if(touch&&dist(touch,P)>30){mx=touch.x-P.x;my=touch.y-P.y;sp=110;}
 const l=Math.hypot(mx,my)||1;if(mx||my){P.x=Math.max(24,Math.min(WORLD_W-24,P.x+mx/l*sp*dt));P.y=Math.max(44,Math.min(WORLD_H-28,P.y+my/l*sp*dt));P.anim+=dt*10;}
 cam.x+=(P.x-cam.x)*Math.min(1,dt*5);cam.y+=(P.y-cam.y)*Math.min(1,dt*5);
 P.cd-=dt;P.shoot-=dt;P.hit-=dt;flash-=dt;if(firing)shoot(false);
 regenT+=dt;if(regenT>2.5&&P.hp<P.max){P.hp=Math.min(P.max,P.hp+1);if(regenT>3)regenT=0;}
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(0.6,1.6-score/400);}
 for(const e of E){const d=Math.hypot(P.x-e.x,P.y-e.y)||1;e.x+=(P.x-e.x)/d*e.sp*dt;e.y+=(P.y-e.y)/d*e.sp*dt;e.anim+=dt*8;e.flash-=dt;e.hit-=dt;if(d<24&&e.hit<=0&&P.hit<=0){P.hp-=5;P.hit=0.8;e.hit=0.6;if(P.hp<=0){P.hp=0;over=true;overT=0;}}}
 for(const a of A){a.x+=Math.cos(a.angle)*a.speed*dt;a.y+=Math.sin(a.angle)*a.speed*dt;a.life-=dt;let hit=false;for(const e of E)if(!e.dead&&dist(a,e)<22){if(a.explosive)doLightning(a.x,a.y);else hurt(e,12);hit=true;break;}if(!hit&&a.explosive&&a.life<=0){doLightning(a.x,a.y);hit=true;}if(hit||a.life<=0)a.dead=true;}
 for(const d of D){d.t-=dt;if(dist(d,P)<28){d.t=0;if(d.k=='fish'){fish++;P.hp=Math.min(P.max,P.hp+15);}else{arrows=Math.min(99,arrows+5);}}}
 for(const f of F)f.t+=dt;for(const t of T){t.t-=dt;t.y-=24*dt;}for(const b of LB)b.t+=dt;
 E=E.filter(e=>!e.dead);A=A.filter(a=>!a.dead);D=D.filter(d=>d.t>0);F=F.filter(f=>f.t<0.4);T=T.filter(t=>t.t>0);LB=LB.filter(b=>b.t<0.35);
}
function draw(now){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);
 ctx.drawImage(bg,0,0);
 for(const d of D){ctx.fillStyle=d.k=='fish'?'#3cf':'#ffe14d';ctx.fillText(d.k=='fish'?'><>':'+ARR',d.x,d.y);}
 const all=E.map(e=>({y:e.y,e})).concat([{y:P.y,p:1}]).sort((a,b)=>a.y-b.y);
 for(const o of all){
  if(o.p){
   ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(P.x,P.y+22,16,5,0,0,7);ctx.fill();
   if(P.hit>0&&((Date.now()/80)|0)%2){}else{
    if(ok(player)){const w=player.width/4;const dir=Math.abs(_aimAng)<0.785?0:Math.abs(_aimAng)>2.356?2:_aimAng>0?1:3;ctx.drawImage(player,dir*w,0,w,player.height,P.x-24,P.y-24,48,48);}else{ctx.fillStyle='#1de9b6';ctx.beginPath();ctx.arc(P.x,P.y,16,0,7);ctx.fill();}
    ctx.save();ctx.translate(P.x,P.y);ctx.rotate(_aimAng);ctx.strokeStyle='#ffb347';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,20,-1,1);ctx.stroke();ctx.restore();
   }
   continue;
  }
  const e=o.e;ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(e.x,e.y+18,12,4,0,0,7);ctx.fill();
  if(ok(enemies)){const w=enemies.width/4;ctx.drawImage(enemies,e.type*w,0,w,enemies.height,e.x-20,e.y-20,40,40);}else{ctx.fillStyle='#e63946';ctx.beginPath();ctx.arc(e.x,e.y,14,0,7);ctx.fill();}
 }
 for(const a of A){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);ctx.fillStyle=a.explosive?'#ff7b00':'#1de9b6';ctx.fillRect(-10,-2,16,4);ctx.restore();}
 for(const lb of LB){const k=1-lb.t/0.35;ctx.globalAlpha=k;for(const pts of lb.bolts){ctx.strokeStyle='#7df9ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();} }ctx.globalAlpha=1;
 ctx.save();ctx.translate(aim.x,aim.y);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.stroke();ctx.restore();
 ctx.restore();
 // UI
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(10,10,160,10);ctx.fillStyle='#2ecc40';ctx.fillRect(10,10,160*P.hp/100,10);
 ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.fillText('HP '+P.hp+' ARR '+arrows+' FOUDRE '+expl+' SCORE '+score,10,36);
 // joysticks visibles
 let jb=joyPos();ctx.globalAlpha=joy.active?0.8:0.3;ctx.beginPath();ctx.arc(jb.x,jb.y,55,0,7);ctx.strokeStyle='#1de9b6';ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(jb.x+joy.dx*30,jb.y+joy.dy*30,24,0,7);ctx.fillStyle='#1de9b6';ctx.fill();ctx.globalAlpha=1;
 jb=joyRPos();ctx.globalAlpha=joyR.active?0.8:0.3;ctx.beginPath();ctx.arc(jb.x,jb.y,45,0,7);ctx.strokeStyle='#ff3cac';ctx.stroke();ctx.beginPath();ctx.arc(jb.x+joyR.dx*25,jb.y+joyR.dy*25,20,0,7);ctx.fillStyle='#ff3cac';ctx.fill();ctx.globalAlpha=1;
 let fb=fireBtnPos();ctx.globalAlpha=firing?0.9:0.4;ctx.beginPath();ctx.arc(fb.x,fb.y,36,0,7);ctx.fillStyle='#ff7b00';ctx.fill();ctx.globalAlpha=1;
 fb=boltBtnPos();ctx.globalAlpha=expl>0?0.8:0.2;ctx.beginPath();ctx.arc(fb.x,fb.y,32,0,7);ctx.fillStyle='#7df9ff';ctx.fill();ctx.globalAlpha=1;
 if(over){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff3cac';ctx.font='bold 28px monospace';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2);ctx.fillStyle='#fff';ctx.font='14px monospace';ctx.fillText('Tap pour rejouer - Score '+score,W/2,H/2+30);}
}
const xy=e=>{const r=canvas.getBoundingClientRect();const sx=(e.clientX-r.left)*W/r.width;const sy=(e.clientY-r.top)*H/r.height;return{sx,sy,x:(sx-W/2)/zoom+cam.x,y:(sy-H/2)/zoom+cam.y};};
const inJoy=p=>{const jb=joyPos();return Math.hypot(p.sx-jb.x,p.sy-jb.y)<70;};
const inJoyR=p=>{const jb=joyRPos();return Math.hypot(p.sx-jb.x,p.sy-jb.y)<60;};
const inFire=p=>{const fb=fireBtnPos();return Math.hypot(p.sx-fb.x,p.sy-fb.y)<50;};
const inBolt=p=>{const bb=boltBtnPos();return Math.hypot(p.sx-bb.x,p.sy-bb.y)<45;};
addEventListener('keydown',e=>{
 const k=e.key.to
