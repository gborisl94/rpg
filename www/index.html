<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>RPG Modular Final</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0b1a3a;overflow:hidden;touch-action:none}#c{display:block;width:100vw;height:100vh}#log{position:fixed;left:0;top:0;right:0;z-index:9999;background:rgba(0,0,0,.9);color:#f55;font:10px monospace;padding:6px;white-space:pre-wrap;pointer-events:none}</style>
</head><body><canvas id="c"></canvas><pre id="log"></pre>
<script>
const LOG=document.getElementById('log');
window.logErr=(m,e)=>{LOG.textContent+=`\n❌ ${m}: ${e?.message||e}`; console.error(m,e);};
window.GameAPI={_aimAng:0};
</script>
<script src="core.js?v=100"></script>
<script src="abilities.js?v=100" onerror="logErr('ABILITIES','manquant')"></script>
<script src="hud.js?v=100" onerror="logErr('HUD','manquant')"></script>
</body></html>
